server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip siqish sozlamalari
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml;

    # Xavfsizlik sarlavhalari (Cloudflare Pages _headers bilan sinxron)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Astro xeshli statik aktivlari (1 yil keshlanadi, o'zgarmas)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Statik rasmlar va media aktivlar
    location /images/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # Pagefind qidiruv WASM va indeks fayllari
    location /pagefind/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # SEO va Favicon fayllari
    location ~* \.(ico|svg|png)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Asosiy HTML marshrutlash va toza URLlar
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 404 Xato sahifasi
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }
}

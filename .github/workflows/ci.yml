name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies (Clean Install)
        run: npm ci

      - name: Astro & TypeScript Typecheck
        run: npm run check

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Static Site & Pagefind Search Index
        run: npm run build

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Accessibility Tests
        run: npm run test:e2e

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

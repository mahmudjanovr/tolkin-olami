<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4EEDF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7D6021" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#7D6021"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #0F1715; }
    .gold-main { fill: url(#goldGrad); }
    .gold-stroke { stroke: #D4B36A; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .ray { stroke: #C5A059; stroke-width: 0.8; opacity: 0.7; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #162220; }
    }
  </style>
  <!-- Background disc matching deep forest slate -->
  <rect width="32" height="32" rx="7" class="bg"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#8C733E" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Star of Earendil / Gil-Estel (8-pointed heraldic star) -->
  <!-- Diagonal subtle rays -->
  <line x1="16" y1="3" x2="16" y2="29" class="ray"/>
  <line x1="3" y1="16" x2="29" y2="16" class="ray"/>
  <line x1="7" y1="7" x2="25" y2="25" class="ray" opacity="0.4"/>
  <line x1="7" y1="25" x2="25" y2="7" class="ray" opacity="0.4"/>
  
  <!-- Outer star polygon -->
  <polygon points="16,3 18.5,12 28,12 20.5,17 23.5,26 16,20.5 8.5,26 11.5,17 4,12 13.5,12"
           fill="url(#goldGrad)" stroke="#E8D196" stroke-width="0.6"/>
           
  <!-- Inner radiant diamond -->
  <polygon points="16,8 19,16 16,24 13,16" fill="#FFF9E6" opacity="0.9"/>
  <polygon points="8,16 16,19 24,16 16,13" fill="#FFF9E6" opacity="0.9"/>
  
  <!-- Center gem core -->
  <circle cx="16" cy="16" r="2.2" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="1.2" fill="#7D6021"/>
</svg>